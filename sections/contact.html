<section class="py-5" id="contact" aria-labelledby="contact-title">
  <div class="container">
    <div class="account-panel mx-auto p-4 p-md-5">
      <div class="row g-5 align-items-start">
        <div class="col-lg-5">
          <span class="badge text-bg-primary section-kicker">Contact</span>
          <h2 class="display-6 my-3" id="contact-title">Let’s get your site online</h2>
          <p class="text-secondary">
            Ask about plans, migrations, or anything you need before getting started.
          </p>
          <p class="mb-1 fw-semibold">Email support</p>
          <a href="mailto:support@angkorhost.example">support@angkorhost.example</a>
          <p class="small text-secondary mt-3">Typical response time: within one business day.</p>
        </div>
        <div class="col-lg-7">
          <form id="contactForm">
            <div class="mb-3">
              <label class="form-label" for="contactName">Name</label>
              <input class="form-control" id="contactName" name="name" autocomplete="name" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="contactEmail">Email address</label>
              <input class="form-control" id="contactEmail" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="contactMessage">How can we help?</label>
              <textarea class="form-control" id="contactMessage" name="message" rows="4" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Send message</button>
            <p class="form-status mt-3" id="contactStatus" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
